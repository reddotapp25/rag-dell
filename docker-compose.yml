services:
  app:
    build: .
    image: langgraph-multiagent-rag:latest
    container_name: langgraph-multiagent-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env or shell}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-mpnet-base-v2}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - chroma_data:/home/user/app/data/chroma
      - ./data/source:/home/user/app/data/source:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  chroma_data:
